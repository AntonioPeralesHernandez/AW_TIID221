<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    
</body>
<div>
    <h1>Regisstro de usuarios</h1>
    <form action="/registro" method="POST">
        <label>Nombre(s): </label>
        <imput type="text" name="nombre">

        <label>Apellido Paterno: </label>
        <imput type="text" name="apellido_p">

        <label>Apellido Materno: </label>
        <imput type="text" name="apellido_m">

        <label>Correo: </label>
        <imput type="email" name="correo">

        <label>Contraseña</label>
        <imput type="password" name="password">

        <label for="id_rol">Rol: </label>
        <select name="id_rol" id="id_rol">
            <option value="1">Administrador</option>
            <option value="2">Usuario</option>
        </select>

        <button type="submit">Registrarse</button>
    </form>
    
    <p><a href="{{ url_for('login') }}">Regresar</a></p>
</div>

</html>
