<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .card {
            width: 150px;
            padding: 20px;
            margin: 20px;
        }

        .card-larga {
            grid-column: 3;
            grid-row: span 3;

            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="background-color: rgb(43, 153, 153);">CARD1</div>
        <div class="card" style="background-color: rgb(231, 191, 61);">CARD2</div>
        <div class="card-larga" style="background-color: rgb(121, 79, 177);">CARD3</div>
        <div class="card" style="background-color: rgb(75, 189, 90);">CARD4</div>
        <div class="card" style="background-color: rgb(214, 88, 162);">CARD5</div>
        <div class="card" style="background-color: rgb(68, 113, 182);">CARD6</div>
        <div class="card" style="background-color: rgb(204, 46, 46);">CARD7</div>
    </div>
    
</body>
</html>
